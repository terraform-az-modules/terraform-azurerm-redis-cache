name: Terraform Azure Managed Redis

intro: |-
  With our comprehensive DevOps toolkit - streamline operations, automate workflows, enhance collaboration and deploy with confidence.

badges_text: "Latest Release | tfsec | License | Changelog"

about: |-
  Terraform module to create and manage Azure Managed Redis (`azurerm_managed_redis`), including geo-replication, private endpoint, diagnostics, and customer-managed keys.

license: "APACHE"

github_repo: terraform-az-modules/terraform-azurerm-redis-cache

badges:
  - name: "Terraform"
    image: "https://img.shields.io/badge/Terraform-v1.10.0-green"
    url: "https://www.terraform.io"

  - name: "Licence"
    image: "https://img.shields.io/badge/License-APACHE-blue.svg"
    url: "LICENSE.md"

prerequisites:
  - name: Terraform
    url: https://learn.hashicorp.com/terraform/getting-started/install.html
    version: ">= 1.10.0"

providers:
  - name: azurerm
    url: https://registry.terraform.io/providers/hashicorp/azurerm/latest
    version: ">= 4.57.0"

description: |-
  Terraform module to create and manage Azure Managed Redis (`azurerm_managed_redis`).

usage: |-
  ### Example

  ```hcl
  module "redis" {
    source              = "terraform-az-modules/redis-cache/azurerm"
    name                = "core"
    environment         = "dev"
    location            = "centralus"
    resource_group_name = module.resource_group.resource_group_name
    sku_name            = "Balanced_B1"
  }
  ```
