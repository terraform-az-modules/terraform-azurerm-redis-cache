name: tf-checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  complete-example:
    uses: clouddrove/github-shared-workflows/.github/workflows/smurf-tf-checks.yml@v2
    with:
      working_directory: './examples/complete/'
      provider: none

  geo-replication:
    uses: clouddrove/github-shared-workflows/.github/workflows/smurf-tf-checks.yml@v2
    with:
      working_directory: './examples/geo-replication/'
      provider: none

  # TFLint Job
  tf-lint:
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-lint.yml@v2
    secrets:
      GITHUB: ${{ secrets.GITHUB }}
